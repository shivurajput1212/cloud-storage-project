<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In - CloudStorage</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f7f9fc;

        }


        .login-box {

            width: 380px;

            background: white;

            padding: 40px;

            border: 1px solid #e1e7ef;

            border-radius: 14px;

        }


        .logo {

            text-align: center;

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        .logo span {

            color: #287bea;

        }


        .subtitle {

            text-align: center;

            color: #718096;

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #dce3ed;

            border-radius: 7px;

            margin-bottom: 18px;

            outline: none;

            font-size: 14px;

        }


        input:focus {

            border-color: #287bea;

        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #287bea;

            color: white;

            font-size: 15px;

            cursor: pointer;

        }


        button:hover {

            background: #1769d3;

        }


        .error {

            background: #fff1f1;

            border: 1px solid #ffcaca;

            color: #d93025;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 18px;

            font-size: 14px;

            text-align: center;

        }


        @media (max-width: 500px) {

            .login-box {

                width: calc(100% - 30px);

                padding: 30px;

            }

        }

    </style>

</head>


<body>


    <div class="login-box">


        <div class="logo">

            ☁ <span>Cloud</span>Storage

        </div>


        <p class="subtitle">

            Sign in to your cloud storage

        </p>


        {% if error %}

            <div class="error">

                {{ error }}

            </div>

        {% endif %}


        <form
            action="/login"
            method="POST"
        >


            <label>

                Username

            </label>


            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>

                Password

            </label>


            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">

                Sign In

            </button>


        </form>


    </div>


</body>

</html>
