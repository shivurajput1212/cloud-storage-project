<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - CloudStorage</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f9fc;
        }

        .signup-box {
            width: 400px;
            background: white;
            padding: 40px;
            border: 1px solid #e1e7ef;
            border-radius: 14px;
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #287bea;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce3ed;
            border-radius: 7px;
            margin-bottom: 17px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #287bea;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #287bea;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1769d3;
        }

        .error {
            background: #fff1f1;
            border: 1px solid #ffcaca;
            color: #d93025;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
            text-align: center;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
        }

        .login-link a {
            color: #287bea;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 500px) {

            .signup-box {
                width: calc(100% - 30px);
                padding: 30px;
            }

        }

    </style>

</head>


<body>

    <div class="signup-box">

        <div class="logo">
            ☁ <span>Cloud</span>Storage
        </div>

        <p class="subtitle">
            Create your cloud storage account
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form
            action="/signup"
            method="POST"
        >

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                minlength="6"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                minlength="6"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="/login">
                Sign In
            </a>

        </div>

    </div>

</body>

</html>
